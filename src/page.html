<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111113">
    <title>Text Gambit</title>
    <style>__PAGE_STYLE__</style>
  </head>
  <body>
    <header>
      <div class="brand wrap">
        <div class="logo" aria-hidden="true">♞</div>
        <h1>Text Gambit</h1>
      </div>
    </header>
    <main class="wrap">
      <div class="layout">
        <section class="card compose">
          <label class="field-label" for="goalInput">Goal</label>
          <input class="goal-input" id="goalInput" type="text" placeholder="What do you want to achieve?">
          <label class="field-label" for="transcript">Chat history</label>
          <textarea class="textarea" id="transcript" aria-describedby="format privacy" placeholder="Paste your chat history here" spellcheck="false"></textarea>
          <div class="format" id="format">Start each message with a name, like <b>Me:</b> or <b>Alice:</b>.</div>
          <div class="actions">
            <button class="btn" id="analyze">Analyze <span aria-hidden="true">↗</span></button>
            <button class="btn secondary" id="reset">Try sample</button>
          </div>
          <div class="privacy">
            <span aria-hidden="true">◆</span>
            <div id="privacy">Analysis sends your text to Google Gemini. Google may use free-tier submissions to improve its products.</div>
          </div>
          <div class="loading" id="loading" role="status" hidden>Analyzing…</div>
          <div class="error" id="error" role="alert"></div>
        </section>
        <section class="card analysis" aria-label="Conversation analysis">
          <div class="replay-layout">
            <aside class="goalbox" aria-label="Goal evaluation">
              <div class="vertical-progress" role="progressbar" aria-label="Goal progress" aria-valuemin="0" aria-valuemax="100" id="progress">
                <div class="fill" id="fill"></div>
              </div>
              <b id="scoreLabel">0%</b>
              <small id="deltaLabel"></small>
            </aside>
            <section class="conversation" aria-label="Message replay">
              <p class="goal-text" id="goalText" tabindex="0"></p>
              <div id="chat" class="chat" role="log" aria-label="Messages" tabindex="0"></div>
              <div class="nav">
                <button id="prev" aria-label="Previous message" aria-keyshortcuts="ArrowLeft">←</button>
                <span id="stepLabel" aria-label="Replay position">0 / 0</span>
                <button id="next" aria-label="Next message" aria-keyshortcuts="ArrowRight">→</button>
              </div>
            </section>
            <aside class="analyst" aria-label="Move analyst">
              <div class="analyst-head">
                <svg class="avatar" viewBox="0 0 64 64" aria-hidden="true">
                  <circle cx="32" cy="32" r="32" fill="#303640"/>
                  <path d="M9 64c2-14 10-19 23-19s21 5 23 19" fill="#76a8eb"/>
                  <path d="M25 42h14v8a7 7 0 0 1-14 0z" fill="#b98768"/>
                  <path d="M16 28c0-14 7-19 16-19s16 5 16 19v6c0 10-8 17-16 17s-16-7-16-17z" fill="#e0af89"/>
                  <path d="M16 32c-4-5-3-15 1-20 7-9 25-10 31 0 4 6 3 13 0 19l-3-9c-5 0-10-3-13-7-3 5-9 8-14 9z" fill="#372d28"/>
                  <path d="M21 30h9v7h-9zm13 0h9v7h-9zm-4 3h4" stroke="#46362b" stroke-width="1.5" stroke-linejoin="round" fill="none"/>
                  <ellipse class="mouth" cx="32" cy="42" rx="3.5" ry="1.6" fill="#784638"/>
                </svg>
                <button type="button" id="speechToggle" class="speech-toggle" aria-label="Spoken explanations" aria-pressed="false" title="Spoken explanations" hidden>
                  <svg viewBox="0 0 24 24" aria-hidden="true" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9h4l5-4v14l-5-4H3z"/>
                    <path class="sound-waves" d="M16 9a4 4 0 0 1 0 6m3-9a8 8 0 0 1 0 12"/>
                    <path class="mute-mark" d="m16 10 5 5m0-5-5 5"/>
                  </svg>
                </button>
              </div>
              <div class="speech" id="speech" aria-live="polite" aria-atomic="true">
                <p id="rationale"></p>
              </div>
            </aside>
          </div>
        </section>
      </div>
    </main>
    <template id="theoryIcon">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 6c-3-2-6-2.5-9-1.5v13c3-1 6-.5 9 1.5 3-2 6-2.5 9-1.5v-13c-3-1-6-.5-9 1.5v13"/>
        <path d="M6 9c1-.1 2 .1 3 .5m6 0c1-.4 2-.6 3-.5"/>
      </svg>
    </template>
    <script>__PAGE_CLIENT__</script>
  </body>
</html>
